[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-security-harness"
version = "0.1.0"
description = "Persistent, evidence-gated multi-agent security research harness for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private local tooling" }
authors = [{ name = "nobcoder" }]
dependencies = []

[project.scripts]
bbp-harness = "bbp_harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bbp_harness = ["py.typed"]
